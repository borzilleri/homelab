name: filebrowser
services:
  filebrowser: # Port 8900 (or 80?)
    image: gtstef/filebrowser:${VERSION}
    container_name: filebrowser
    restart: unless-stopped
    labels:
      wud.watch: true
      wud.tag.include: '^\d+\.\d+\.\d+$'
      wud.link.template: 'https://github.com/gtsteffaniak/filebrowser/releases/tag/v$${original}'
    environment:
      FILEBROWSER_CONFIG: "data/config.yaml"
    volumes:
      - central-dogma:/central-dogma
      - dogma-archive:/DogmaArchive
      - /opt/appdata/filebrowser/data:/home/filebrowser/data
    networks:
      - homelab

volumes:
  central-dogma:
    driver: local
    driver_opts:
      type: nfs
      o: addr=central-dogma.sdf1.internal,nolock,soft,nfsvers=4
      device: :/volume1/Media
  dogma-archive:
    driver: local
    driver_opts:
      type: nfs
      o: addr=terminal-dogma.sdf1.internal,nolock,soft,nfsvers=4
      device: :/mnt/DataPool/DogmaArchive

networks:
  homelab:
    external: true