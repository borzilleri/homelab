services:
  dockhand: #Port 3000
    image: fnsys/dockhand:${VERSION:-latest}
    container_name: dockhand
    restart: unless-stopped
    ports: 
      - 3000:3000
    environment:
      PUID: 1000
      PGID: 1000
      DISABLE_LOCAL_LOGIN: false
      OIDC_AUTOLOGIN: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/homelab:/homelab:ro
      - dockhand_data:/app/data
    networks:
      - homelab

volumes:
  dockhand_data:

networks:
  homelab:
    name: homelab
    external: true