# Additional Plugins:
# https://github.com/Evan-2007/bookorbit-annas-archive-plugin/releases

name: bookorbit
services:
  app:
    container_name: bookorbit-app
    image: ghcr.io/bookorbit/bookorbit:${VERSION}
    restart: unless-stopped
    init: true
    labels:
      wud.watch: true
      wud.tag.include: '^\d+\.\d+\.\d+$'
      wud.link.template: 'https://github.com/bookorbit/bookorbit/v$${original}'
    environment:
      NODE_ENV: production
      PORT: 3000
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: bookorbit
      POSTGRES_USER: bookorbit
      SETUP_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      EMAIL_ENCRYPTION_KEY_FILE: /run/secrets/email_key
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      BOOK_REQUEST_ENCRYPTION_KEY_FILE: /run/secrets/request_key
      MIGRATION_ENCRYPTION_KEY_file: /run/secrets/migration_key
      APP_URL: https://bookorbit.sdf1.rampant.io
      CLIENT_URL: https://bookorbit.sdf1.rampant.io
      NODE_MAX_OLD_SPACE_SIZE: 2048
      DISABLE_LOCAL_AUTH: ${DISABLE_LOCAL_AUTH:-false}
      BOOK_DOCK_PATH: /book_dock
      LIBRARY_BROWSE_ROOT: /books
    secrets:
      - bootstrap_token
      - email_key
      - db_password
      - jwt_secret
      - migration_key
      - request_key
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /opt/appdata/bookorbit/data:/data
      - /opt/appdata/bookorbit/book_dock:/book_dock
      - type: volume
        source: app-data
        target: /books
        volume:
          nocopy: true
          subpath: bookorbit_books
      - type: volume
        source: central-dogma
        target: /downloads/sabnzbd
        volume:
          nocopy: true
          subpath: downloads/bookdrop
      - type: volume
        source: central-dogma
        target: /downloads/transmission
        volume:
          nocopy: true
          subpath: downloads/transmission/complete
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - internal
      - homelab

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookorbit
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - db_password
    volumes:
      - /opt/appdata/bookorbit/db:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

secrets:
  bootstrap_token:
    environment: BOOTSTRAP_TOKEN
  email_key:
    environment: EMAIL_KEY
  db_password:
    environment: DB_PASSWORD
  jwt_secret:
    environment: JWT_SECRET
  migration_key:
    environment: MIGRATION_KEY
  request_key:
    environment: REQUEST_KEY

networks:
  internal:
    internal: true
  homelab:
    external: true

volumes:
  app-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=terminal-dogma.sdf1.internal,nolock,soft,nfsvers=4
      device: :/mnt/DataPool/AppData
  central-dogma:
    driver: local
    driver_opts:
      type: nfs
      o: addr=central-dogma.local,nolock,soft,nfsvers=4
      device: :/volume1/Media