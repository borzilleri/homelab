name: authentik
services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik-db
    restart: unless-stopped
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pass
    secrets:
      - postgres_pass
    volumes:
      - /opt/docker_data/authentik/pg16:/var/lib/postgresql/data
  server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    container_name: authentik
    restart: unless-stopped
    command: server
    ports:
      - 9443:9443
      - 9000:9000
    user: "1000:1000"
    shm_size: 512mb
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik_secret_key
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/postgres_pass
      AUTHENTIK_EMAIL__HOST: smtp.fastmail.com
      AUTHENTIK_EMAIL__PORT: 465
      AUTHENTIK_EMAIL__USERNAME: file:///run/secrets/fastmail_user
      AUTHENTIK_EMAIL__PASSWORD: file:///run/secrets/fastmail_pass
      AUTHENTIK_EMAIL__USE_SSL: true
      AUTHENTIK_EMAIL__TIMEOUT: 10
      AUTHENTIK_EMAIL__FROM: authentik@rampant.io
    secrets:
      - authentik_secret_key
      - postgres_pass
      - fastmail_user
      - fastmail_pass
    volumes:
      - /opt/docker_data/authentik/data/data:/data
      - /opt/docker_data/authentik/data/certs:/certs
      - /opt/docker_data/authentik/data/custom-templates:/templates
  worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    user: "1000:1000"
    shm_size: 512mb
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik_secret_key
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/postgres_pass
      AUTHENTIK_EMAIL__HOST: smtp.fastmail.com
      AUTHENTIK_EMAIL__PORT: 465
      AUTHENTIK_EMAIL__USERNAME: file:///run/secrets/fastmail_user
      AUTHENTIK_EMAIL__PASSWORD: file:///run/secrets/fastmail_pass
      AUTHENTIK_EMAIL__USE_SSL: true
      AUTHENTIK_EMAIL__TIMEOUT: 10
      AUTHENTIK_EMAIL__FROM: authentik@rampant.io
    secrets:
      - authentik_secret_key
      - postgres_pass
      - fastmail_user
      - fastmail_pass
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/docker_data/authentik/data/data:/data
      - /opt/docker_data/authentik/data/certs:/certs
      - /opt/docker_data/authentik/data/custom-templates:/templates

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:${PROXY_VERSION}
    container_name: authentik-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 1
      INFO: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock


secrets:
  authentik_secret_key:
    environment: SECRET_KEY
  postgres_pass:
    environment: DB_PASSWORD
  fastmail_user:
    environment: FASTMAIL_USER
  fastmail_pass:
    environment: FASTMAIL_PASSWORD
