name: servarr
services:
  db:
    image: postgres:14
    container_name: servarr-db
    restart: unless-stopped
    user: "1000:1000"
    environment:
      POSTGRES_USER: servarr
      POSTGRES_PASSWORD_FILE: /run/secrets/db_pass
    secrets:
      - db_pass
    volumes:
      - /opt/appdata/servarr/db/pg14:/var/lib/postgresql/data
    networks:
      - internal

  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_VERSION}
    container_name: radarr
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      RADARR__POSTGRES__HOST: db
      RADARR__POSTGRES__PORT: 5432
      RADARR__POSTGRES__USER: servarr
      RADARR__POSTGRES__PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/appdata/servarr/radarr:/config
      - central-dogma:/data
      - type: volume
        source: app-data
        target: /backups
        volume:
          nocopy: true
          subpath: servarr/radarr
    networks:
      - internal
      - homelab

  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_VERSION}
    container_name: sonarr
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      SONARR__POSTGRES__HOST: db
      SONARR__POSTGRES__PORT: 5432
      SONARR__POSTGRES__USER: servarr
      SONARR__POSTGRES__PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/appdata/servarr/sonarr:/config
      - central-dogma:/data
      - type: volume
        source: app-data
        target: /backups
        volume:
          nocopy: true
          subpath: servarr/sonarr
    networks:
      - internal
      - homelab

  bazarr:
    image: lscr.io/linuxserver/bazarr:${BAZARR_VERSION}
    container_name: bazarr
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      POSTGRES_ENABLED: True
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: servarr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/appdata/servarr/bazarr:/config
      - central-dogma:/data
      - type: volume
        source: app-data
        target: /backups
        volume:
          nocopy: true
          subpath: servarr/bazarr
    networks:
      - internal
      - homelab
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_VERSION}
    container_name: prowlarr
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      PROWLARR__POSTGRES__HOST: db
      PROWLARR__POSTGRES__PORT: 5432
      PROWLARR__POSTGRES__USER: servarr
      PROWLARR__POSTGRES__PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/appdata/servarr/prowlarr:/config
      - type: volume
        source: app-data
        target: /backups
        volume:
          nocopy: true
          subpath: servarr/prowlarr
    networks:
      - internal
      - homelab

  maintainerr: # Port 6246 
    image: ghcr.io/maintainerr/maintainerr:${MAINTAINERR_VERSION}
    container_name: maintainerr
    restart: unless-stopped
    user: 1000:1000
    environment:
      TZ: America/Los_Angeles
    volumes:
      - /opt/appdata/servarr/maintainerr:/opt/data
    networks:
      - internal
      - homelab

  sabnzbd: # Port 8080
    image: lscr.io/linuxserver/sabnzbd:${SABNZBD_VERSION}
    container_name: sabnzbd
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
    volumes:
      - /opt/appdata/servarr/sabnzbd:/config
      - central-dogma:/data
      - type: volume
        source: app-data
        target: /backups
        volume:
          nocopy: true
          subpath: servarr/sabnzbd
    networks:
      - internal
      - homelab

  transmission: # Port 9091
    image: lscr.io/linuxserver/transmission:${TRANSMISSION_VERSION}
    container_name: transmission
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      USER: admin
      PASS: ${TRANSMISSION_PASSWORD}
    ports:
      - 51413:51413
      - 51413:51413/udp
    volumes:
      - central-dogma:/data
      - /opt/appdata/servarr/transmission:/config
    networks:
      - internal
      - homelab

  qbittorrent: # Port 8080
    image: qbittorrentofficial/qbittorrent-nox:${QBITTORRENT_VERSION}
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true # re-attach to gluetun's netns when it is recreated
    stop_grace_period: 30m
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      QBT_LEGAL_NOTICE: confirm
    volumes:
      - /opt/appdata/servarr/qbittorrent:/config
      - central-dogma:/data

  qui: # Port 7476
    image: ghcr.io/autobrr/qui:${QUI_VERSION}
    container_name: qui
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      QUI__SESSION_SECRET_FILE: /run/secrets/qui_session_secret
    secrets:
      - qui_session_secret
    volumes:
      - /opt/appdata/servarr/qui:/config
    networks:
      - internal
      - homelab

  gluetun:
    image: qmcgaw/gluetun:${GLUETUN_VERSION}
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: America/Los_Angeles
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard # NordLynx
      SERVER_COUNTRIES: United States
      UPDATER_PERIOD: 480h
    secrets:
      - wireguard_private_key
    volumes:
      - /opt/appdata/servarr/gluetun:/gluetun
    networks:
      default: # internet egress for the VPN tunnel; `internal` has none
      internal:
        aliases:
          - qbittorrent # qbittorrent shares this netns

volumes:
  app-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=terminal-dogma.sdf1.internal,nolock,soft,nfsvers=4
      device: :/mnt/DataPool/AppData
  central-dogma:
    driver: local
    driver_opts:
      type: nfs
      o: addr=central-dogma.sdf1.internal,nolock,soft,nfsvers=4
      device: :/volume1/Media

secrets:
  db_pass:
    environment: DB_PASSWORD
  wireguard_private_key:
    environment: WIREGUARD_PRIVATE_KEY
  qui_session_secret:
    environment: QUI_SESSION_SECRET

networks:
  internal:
    internal: true
  homelab:
    external: true