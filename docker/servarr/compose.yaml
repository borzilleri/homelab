name: servarr
services:
  db:
    image: postgres:14
    container_name: servarr-db
    restart: unless-stopped
    user: "1000:1000"
    environment:
      POSTGRES_USER: servarr
      POSTGRES_PASSWORD_FILE: /run/secrets/db_pass
    secrets:
      - db_pass
    volumes:
      - /opt/appdata/servarr/db/pg14:/var/lib/postgresql/data
    networks:
      - internal

  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_VERSION}
    container_name: radarr
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      RADARR__POSTGRES__HOST: db
      RADARR__POSTGRES__PORT: 5432
      RADARR__POSTGRES__USER: servarr
      RADARR__POSTGRES__PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/appdata/servarr/radarr:/config
      - central-dogma:/data
      - type: volume
        source: app-data
        target: /backups
        volume:
          nocopy: true
          subpath: servarr/radarr
    networks:
      - internal
      - homelab

  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_VERSION}
    container_name: sonarr
    restart: always
    depends_on:
      - db
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      SONARR__POSTGRES__HOST: db
      SONARR__POSTGRES__PORT: 5432
      SONARR__POSTGRES__USER: servarr
      SONARR__POSTGRES__PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/appdata/servarr/sonarr:/config
      - central-dogma:/data
      - type: volume
        source: app-data
        target: /backups
        volume:
          nocopy: true
          subpath: servarr/sonarr
    networks:
      - internal
      - homelab

  bazarr:
    image: lscr.io/linuxserver/bazarr:${BAZARR_VERSION}
    container_name: bazarr
    restart: always
    depends_on:
      - db
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      POSTGRES_ENABLED: True
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: servarr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/appdata/servarr/bazarr:/config
      - central-dogma:/data
      - type: volume
        source: app-data
        target: /backups
        volume:
          nocopy: true
          subpath: servarr/bazarar
    networks:
      - internal
      - homelab
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_VERSION}
    container_name: prowlarr
    restart: always
    depends_on:
      - db
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      PROWLARR__POSTGRES__HOST: db
      PROWLARR__POSTGRES__PORT: 5432
      PROWLARR__POSTGRES__USER: servarr
      PROWLARR__POSTGRES__PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/appdata/servarr/prowlarr:/config
      - type: volume
        source: app-data
        target: /backups
        volume:
          nocopy: true
          subpath: servarr/prowlarr
    networks:
      - internal
      - homelab

  maintainerr: # Port 6246 
    image: ghcr.io/maintainerr/maintainerr:${MAINTAINERR_VERSION}
    container_name: maintainerr
    restart: unless-stopped
    user: 1000:1000
    environment:
      TZ: America/Los_Angeles
    volumes:
      - /opt/appdata/servarr/maintainerr:/opt/data
    networks:
      - internal
      - homelab

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:${SABNZBD_VERSION}
    container_name: sabnzbd
    restart: always
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
    volumes:
      - /opt/appdata/servarr/sabnzbd:/config
      - central-dogma:/data
      - type: volume
        source: app-data
        target: /backups
        volume:
          nocopy: true
          subpath: servarr/sabnzbd
    networks:
      - internal
      - homelab

  transmission:
    image: lscr.io/linuxserver/transmission:${TRANSMISSION_VERSION}
    container_name: transmission
    restart: always
    labels:
      wud.watch: true
      wud.tag.include: '^\d+\.\d+\.\d+$'
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      USER: admin
      PASS: ${TRANSMISSION_PASSWORD}
    ports:
      - 51413:51413
      - 51413:51413/udp
    volumes:
      - central-dogma:/data
      - /opt/appdata/servarr/transmission:/config
    networks:
      - internal
      - homelab

volumes:
  app-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=terminal-dogma.sdf1.internal,nolock,soft,nfsvers=4
      device: :/mnt/DataPool/AppData
  central-dogma:
    driver: local
    driver_opts:
      type: nfs
      o: addr=central-dogma.sdf1.internal,nolock,soft,nfsvers=4
      device: :/volume1/Media

secrets:
  db_pass:
    environment: DB_PASSWORD

networks:
  internal:
    internal: true
  homelab:
    external: true