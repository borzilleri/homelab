name: beszel
services:
  agent:
    image: henrygd/beszel-agent:${VERSION}
    container_name: "beszel-agent"
    restart: unless-stopped
    network_mode: host
    labels:
      wud.watch: true
      wud.tag.include: '^\d+\.\d+\.\d+$'
      wud.link.template: 'https://github.com/henrygd/beszel/releases/tag/v$${original}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      KEY: ${PUBLIC_KEY}