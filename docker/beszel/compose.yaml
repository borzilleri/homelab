name: beszel
services:
  beszel:
    image: henrygd/beszel:${VERSION}
    container_name: beszel
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 8090:8090
    labels:
      wud.watch: true
      wud.tag.include: '^\d+\.\d+\.\d+$'
      wud.link.template: 'https://github.com/henrygd/beszel/releases/tag/v$${original}'
    volumes:
      - /opt/appdata/beszel:/beszel_data
      - type: volume
        source: app-data
        target: /beszel_data/backups
        volume:
          nocopy: true
          subpath: beszel
    networks:
      - homelab

  agent:
    image: henrygd/beszel-agent:${VERSION}
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 45876
      KEY: ${PUBLIC_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro

networks:
  homelab:
    external: true

volumes:
  app-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=terminal-dogma.sdf1.internal,nolock,soft,nfsvers=4
      device: :/mnt/DataPool/AppData
