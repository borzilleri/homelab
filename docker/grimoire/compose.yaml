name: grimoire
services:
  grimoire: # Port 9481
    image: hunterreadca/grimoire:${VERSION}
    container_name: grimoire
    restart: unless-stopped
    labels:
      wud.watch: true
      wud.tag.include: '^\d+\.\d+\.\d+$'
      wud.link.template: 'https://github.com/hunterreadca/grimoire/releases/tag/v$${original}'
    environment:
      TZ: America/Los_Angeles
      SECRET_KEY: ${SECRET_KEY}
      VALKEY_URL: redis://valkey:6379/0
      WORKERS: 2
      LIBRARY_PATH: /library
      DATA_PATH: /data
      BASE_URL: https://grimoire.sdf1.rampant.io
    volumes:
      - /opt/appdata/grimoire/data:/data
      - type: volume
        source: dogma-archive
        target: /library
        volume:
          nocopy: true
          subpath: "RPG Library"
    depends_on:
      - valkey
    networks:
      - internal
      - homelab

  valkey:
    image: valkey/valkey:8-alpine
    container_name: grimoire-valkey
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    networks:
      - internal

volumes:
  valkey_data:
  dogma-archive:
    driver: local
    driver_opts:
      type: nfs
      o: addr=terminal-dogma.sdf1.internal,nolock,soft,nfsvers=4
      device: :/mnt/DataPool/DogmaArchive

networks:
  internal:
    internal: true
  homelab:
    external: true