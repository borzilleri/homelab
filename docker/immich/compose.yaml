name: immich

services:
  immich-server: # Port 2283
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD_FILE: /run/secrets/db_pass
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - type: volume
        source: library-data
        target: /data
        volume:
          nocopy: true
          subpath: immich
      - type: volume
        source: library-data
        target: /mnt/external
        volume:
          nocopy: true
          subpath: external
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false
    secrets:
      - db_pass
    networks:
      - internal
      - homelab

  kiosk: # Port 3000
    image: ghcr.io/damongolding/immich-kiosk:${KIOSK_VERSION}
    container_name: immich_kiosk
    restart: unless-stopped
    environment:
      LANG: en_US
      TZ: America/Los_Angeles
    volumes:
      - /opt/appdata/immich/kiosk_config:/config
    healthcheck:
      test: ["CMD", "/kiosk", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - immich-server
    networks:
      - internal
      - homelab

  power-tools: # port 3000
    image: ghcr.io/immich-power-tools/immich-power-tools:${TOOLS_VERSION}
    container_name: immich_power_tools
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      IMMICH_URL: http://immich-server:2283
      EXTERNAL_IMMICH_URL: https://immich.sdf1.rampant.io
      IMMICH_API_KEY: ${POWER_TOOLS_API_KEY}
      DB_HOST: database
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
      - homelab

  immich-metadata-api: # Port 8000
    image: ghcr.io/borzilleri/immich-metadata-api:${METADATA_API_VERSION}
    container_name: immich_metadata_api
    restart: unless-stopped
    environment:
      IMMICH_INTERNAL_URL: http://immich-server:2283/api
      TZ: America/Los_Angeles
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD_FILE: /run/secrets/db_pass
    secrets:
      - db_pass
    depends_on:
      - database
      - immich-server
    networks:
      - internal
      - homelab

  immich-public-proxy: # Port 3000
    container_name: immich-public-proxy
    restart: unless-stopped
    image: alangrainger/immich-public-proxy:${PUBLIC_PROXY_VERSION}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    environment:
      PUBLIC_BASE_URL: https://photos.rampant.io
      IMMICH_URL: http://immich-server:2283
    healthcheck:
      test: curl -sf -m 4 http://localhost:3000/share/healthcheck -o /dev/null || exit 1
      start_period: 10s
      timeout: 5s
    networks:
      - internal
      - homelab

  immich-machine-learning:
    container_name: immich_machine_learning
    restart: unless-stopped
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    volumes:
      - model-cache:/cache
    environment:
      TZ: America/Los_Angeles
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD_FILE: /run/secrets/db_pass
      ORT_DISABLE_TELEMETRY: 1
    healthcheck:
      disable: false
    networks:
      - internal

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - internal

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    shm_size: 128mb
    user: "1000:1000"
    environment:
      POSTGRES_INITDB_ARGS: '--data-checksums'
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_PASSWORD_FILE: /run/secrets/db_pass
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    secrets:
      - db_pass
    volumes:
      - /opt/appdata/immich/db/pg14:/var/lib/postgresql/data
    networks:
      - internal


networks:
  internal:
    internal: true
  homelab:
    external: true

volumes:
  model-cache:
  library-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=terminal-dogma.local,nolock,soft,nfsvers=4
      device: :/mnt/DataPool/Photos

secrets:
  db_pass:
    environment: DB_PASSWORD
