name: bar-assistant
services:
  meilisearch: # Port 7700
    image: getmeili/meilisearch:v1.15
    container_name: ba-search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: true
      MEILI_ENV: production
    networks:
      - homelab
      - internal
    volumes:
      - meili_data:/meili_data

  # Optional, but recommended
  redis:
    image: redis
    restart: unless-stopped
    environment:
      ALLOW_EMPTY_PASSWORD: yes
    networks:
      - internal

  bar-assistant: # Port 8080
    image: barassistant/server:${BAR_VERSION}
    container_name: bar-assistant
    restart: unless-stopped
    depends_on:
      - meilisearch
      - redis
    labels:
      wud.watch: true
      wud.tag.include: '^\d+\.\d+\.\d+$'
      wud.link.template: 'https://github.com/karlomikus/bar-assistant/releases/tag/v$${original}'
    environment:
      APP_URL: "https://bar.sdf1.rampant.io/api"
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      AUTHENTIK_BASE_URL: https://auth.sdf1.rampant.io
      AUTHENTIK_REDIRECT_URI: https://bar.sdf1.rampant.io/oauth/callback
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
      ENABLE_PASSWORD_LOGIN: ${ENABLE_PASSWORD_LOGIN}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION}
    networks:
      - homelab
      - internal
    volumes:
      - bar_data:/var/www/cocktails/storage/bar-assistant

  salt-rim: # Port 8080
    image: barassistant/salt-rim:${SALTRIM_VERSION}
    container_name: salt-rim
    restart: unless-stopped
    depends_on:
      - bar-assistant
    labels:
      wud.watch: true
      wud.tag.include: '^\d+\.\d+\.\d+$'
      wud.link.template: 'https://github.com/karlomikus/vue-salt-rim/releases/tag/v$${original}'
    environment:
      API_URL: "https://bar.sdf1.rampant.io/api"
      MEILISEARCH_URL: "https://bar.sdf1.rampant.io/search"
    networks:
      - homelab
      - internal

volumes:
  meili_data:
  bar_data:

networks:
  internal:
    internal: true
  homelab:
    external: true